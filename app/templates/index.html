<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recipe Genie</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f1ec;
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    height: 85vh;
    overflow: hidden;
  }
  header {
    background: #2f6f4e;
    color: white;
    padding: 16px 20px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .msg { margin-bottom: 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.4;
    font-size: 14px;
  }
  .msg.user .bubble { background: #2f6f4e; color: white; border-bottom-right-radius: 2px; }
  .msg.bot .bubble { background: #f0efe9; color: #222; border-bottom-left-radius: 2px; }
  form {
    display: flex;
    border-top: 1px solid #eee;
    padding: 12px;
    gap: 8px;
  }
  input[type=text] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  button {
    background: #2f6f4e;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #255c40; }
  .hint { font-size: 12px; color: #888; padding: 0 20px 10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🍲 Recipe Genie</h1>
    <p>Tell me what's in your kitchen — I'll recommend what to cook.</p>
  </header>
  <div id="log"></div>
  <div class="hint">Try: "I have chicken, tomato and onion, vegan under 30 minutes"</div>
  <form id="form">
    <input id="input" type="text" autocomplete="off" placeholder="I have paneer, tomato and onion..." />
    <button type="submit">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');

function addMsg(text, who) {
  const row = document.createElement('div');
  row.className = 'msg ' + who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

addMsg("Hi! I'm Recipe Genie. Tell me what ingredients you have, and I'll suggest recipes you can make. Type 'help' anytime.", 'bot');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    });
    const data = await res.json();
    addMsg(data.reply, 'bot');
  } catch (err) {
    addMsg('Sorry, something went wrong talking to the server.', 'bot');
  }
});
</script>
</body>
</html>
